---
haproxy_package_name: haproxy
haproxy_config_dir: /etc/haproxy
haproxy_config_file: /etc/haproxy/haproxy.cfg
haproxy_service_name: haproxy
haproxy_user: haproxy
haproxy_group: haproxy
haproxy_stats_enabled: true
haproxy_stats_port: 9000
haproxy_stats_uri: /haproxy-stats
haproxy_global_maxconn: 4096
haproxy_client_timeout: 30s
haproxy_server_timeout: 30s
haproxy_connect_timeout: 5s
haproxy_retries: 3
haproxy_ssl_enabled: false
haproxy_ssl_cert_path: /etc/ssl/certs
haproxy_ssl_key_path: /etc/ssl/private
haproxy_ssl_ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
haproxy_ssl_min_version: TLSv1.2
haproxy_log_server: 127.0.0.1
haproxy_log_facility: local0
haproxy_log_level: info
haproxy_stick_table_enabled: false
haproxy_stick_table_size: 200k
haproxy_stick_table_expire: 30m
haproxy_extra_packages: []
haproxy_selinux_enabled: false
haproxy_firewall_provider: ufw
haproxy_firewall_zone: public
haproxy_backends:
  webservers:
    balance: roundrobin
    port: 8080
    health_check: httpchk GET /health
    health_interval: 5s
    servers:
      - name: web1
        address: 10.0.1.10
        weight: 100
      - name: web2
        address: 10.0.1.11
        weight: 100
      - name: web3
        address: 10.0.1.12
        weight: 100
  api:
    balance: leastconn
    port: 3000
    health_check: httpchk GET /api/health
    health_interval: 10s
    servers:
      - name: api1
        address: 10.0.2.10
        weight: 100
      - name: api2
        address: 10.0.2.11
        weight: 100
