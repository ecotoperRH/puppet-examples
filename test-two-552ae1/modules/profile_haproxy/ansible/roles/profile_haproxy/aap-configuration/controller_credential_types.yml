---
controller_credential_types:
- name: HAProxy Stats Password
  description: eyaml-encrypted HAProxy stats page HTTP Basic Auth password, stored
    in profile_haproxy Hiera data
  kind: cloud
  inputs:
    fields:
    - id: stats_user
      type: string
      label: Stats Username
      help_text: 'Username for HAProxy stats page HTTP Basic Auth (default: admin)'
    - id: stats_password
      type: string
      label: Stats Password
      secret: true
      help_text: Password for HAProxy stats page HTTP Basic Auth, sourced from eyaml-encrypted
        profile_haproxy::stats_password in data/common.yaml and modules/profile_haproxy/data/common.yaml
    required:
    - stats_user
    - stats_password
  injectors:
    extra_vars:
      stats_user: !unsafe '{{ stats_user }}'
      stats_password: !unsafe '{{ stats_password }}'
