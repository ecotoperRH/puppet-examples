- name: Validate HAProxy configuration
  ansible.builtin.command:
    cmd: haproxy -c -f {{ haproxy_config_file }} -f {{ haproxy_config_dir }}/conf.d
  changed_when: false
  register: haproxy_config_check_result
- name: Deploy HAProxy logrotate configuration
  ansible.builtin.copy:
    content: "/var/log/haproxy/*.log {\n    daily\n    rotate 14\n    missingok\n    notifempty\n    compress\n    delaycompress\n    sharedscripts\n    postrotate\n
      \       /bin/kill -HUP $(cat /var/run/haproxy.pid 2>/dev/null) 2>/dev/null || true\n    endscript\n}\n"
    dest: /etc/logrotate.d/haproxy
    owner: root
    group: root
    mode: '0644'
    backup: true
- name: Ensure HAProxy service is enabled and running
  ansible.builtin.service:
    name: '{{ haproxy_service_name }}'
    state: started
    enabled: true
