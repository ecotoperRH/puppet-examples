---
argument_specs:
  main:
    short_description: Deploy and manage HAProxy as a load balancer
    description:
      - Installs HAProxy and OS-specific dependencies.
      - Creates the haproxy system user and group.
      - Writes the main haproxy.cfg from a Jinja2 template.
      - Generates per-backend config fragments from a loop over haproxy_backends.
      - Manages custom error pages, optional stick-tables, and logrotate config.
      - Configures firewall rules via firewalld (RedHat) or ufw (Debian).
      - Validates HAProxy configuration before restarting the service.
    options:
      haproxy_package_name:
        type: str
        required: false
        default: haproxy
        description: Name of the HAProxy package to install.
      haproxy_config_dir:
        type: str
        required: false
        default: /etc/haproxy
        description: Directory where HAProxy configuration files are stored.
      haproxy_config_file:
        type: str
        required: false
        default: /etc/haproxy/haproxy.cfg
        description: Full path to the main HAProxy configuration file.
      haproxy_service_name:
        type: str
        required: false
        default: haproxy
        description: Name of the HAProxy system service.
      haproxy_user:
        type: str
        required: false
        default: haproxy
        description: System user that HAProxy runs as.
      haproxy_group:
        type: str
        required: false
        default: haproxy
        description: System group that HAProxy runs as.
      haproxy_stats_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable the HAProxy statistics page.
      haproxy_stats_port:
        type: int
        required: false
        default: 9000
        description: TCP port for the HAProxy statistics listener.
      haproxy_stats_uri:
        type: str
        required: false
        default: /haproxy-stats
        description: URI path for the HAProxy statistics page.
      stats_user:
        type: str
        required: true
        description: Username for HAProxy stats basic authentication. Injected at runtime by the AAP HAProxy credential type.
      stats_password:
        type: str
        required: true
        description: Password for HAProxy stats basic authentication. Injected at runtime by the AAP HAProxy credential type.
      haproxy_global_maxconn:
        type: int
        required: false
        default: 4096
        description: Global maximum number of concurrent connections.
      haproxy_client_timeout:
        type: str
        required: false
        default: 30s
        description: Timeout for client inactivity.
      haproxy_server_timeout:
        type: str
        required: false
        default: 30s
        description: Timeout for server response.
      haproxy_connect_timeout:
        type: str
        required: false
        default: 5s
        description: Timeout for establishing a connection to a backend server.
      haproxy_retries:
        type: int
        required: false
        default: 3
        description: Number of retries to perform on a server after a connection failure.
      haproxy_ssl_enabled:
        type: bool
        required: false
        default: false
        description: Whether to enable SSL/TLS termination on the frontend.
      haproxy_ssl_cert_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing SSL certificates.
      haproxy_ssl_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing SSL private keys.
      haproxy_ssl_ciphers:
        type: str
        required: false
        default: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
        description: Colon-separated list of SSL cipher suites for the frontend bind.
      haproxy_ssl_min_version:
        type: str
        required: false
        default: TLSv1.2
        description: Minimum SSL/TLS protocol version to accept.
      haproxy_log_server:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address of the syslog server for HAProxy logs.
      haproxy_log_facility:
        type: str
        required: false
        default: local0
        description: Syslog facility for HAProxy log messages.
      haproxy_log_level:
        type: str
        required: false
        default: info
        description: Syslog severity level for HAProxy log messages.
      haproxy_stick_table_enabled:
        type: bool
        required: false
        default: false
        description: Whether to deploy a stick-table configuration fragment.
      haproxy_stick_table_size:
        type: str
        required: false
        default: 200k
        description: Maximum number of entries in the stick-table.
      haproxy_stick_table_expire:
        type: str
        required: false
        default: 30m
        description: Expiry time for stick-table entries.
      haproxy_extra_packages:
        type: list
        elements: str
        required: false
        default: []
        description: Additional OS-specific packages to install alongside HAProxy. Overridden per OS family in group_vars (e.g. hatop on Debian,
          haproxy-systemd-wrapper on RedHat).
      haproxy_selinux_enabled:
        type: bool
        required: false
        default: false
        description: Whether to set the haproxy_connect_any SELinux boolean. Set to true on RedHat systems via group_vars/RedHat.yml.
      haproxy_firewall_provider:
        type: str
        required: false
        default: ufw
        description: "Firewall management backend to use. Supported values: firewalld (RedHat), ufw (Debian). Overridden per OS family in group_vars."
      haproxy_firewall_zone:
        type: str
        required: false
        default: public
        description: firewalld zone to add HAProxy port rules to (RedHat only).
      haproxy_backends:
        type: dict
        required: false
        default:
          webservers:
            balance: roundrobin
            port: 8080
            health_check: httpchk GET /health
            health_interval: 5s
            servers:
              - name: web1
                address: 10.0.1.10
                weight: 100
          api:
            balance: leastconn
            port: 3000
            health_check: httpchk GET /api/health
            health_interval: 10s
            servers:
              - name: api1
                address: 10.0.2.10
                weight: 100
        description: "Dictionary of HAProxy backend definitions. Each key is the backend name; the value is a dict with keys: balance, port, health_check (optional),
          health_interval (optional), and servers (list of {name, address, weight}). Override at group_vars / host_vars level to customise per environment."
