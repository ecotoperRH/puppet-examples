---
controller_credential_types:
- name: HAProxy Stats Password
  description: eyaml PKCS7-encrypted HAProxy statistics page password, must be decrypted
    and re-encrypted with Ansible Vault
  kind: cloud
  inputs:
    fields:
    - id: stats_user
      type: string
      label: Stats Username
      help_text: 'Username for the HAProxy statistics page (default: admin)'
    - id: stats_password
      type: string
      label: Stats Password
      secret: true
      help_text: Password for the HAProxy statistics page, originally encrypted with
        eyaml PKCS7 in profile_haproxy::stats_password (common.yaml). Must be decrypted
        using the PKCS7 private key and re-encrypted with ansible-vault.
    required:
    - stats_user
    - stats_password
  injectors:
    extra_vars:
      stats_user: !unsafe '{{ stats_user }}'
      stats_password: !unsafe '{{ stats_password }}'
