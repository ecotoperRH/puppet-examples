profile_haproxy_log_server: 10.100.1.50
profile_haproxy_ntp_servers:
- ntp1.dc1.fra.example.com
- ntp2.dc1.fra.example.com
profile_haproxy_backends:
  webservers:
    balance: roundrobin
    port: 8080
    health_check: httpchk GET /health
    health_interval: 5s
    servers:
    - name: web1-fra
      address: 10.100.1.10
      weight: 100
    - name: web2-fra
      address: 10.100.1.11
      weight: 100
    - name: web3-fra
      address: 10.100.1.12
      weight: 100
  api:
    balance: leastconn
    port: 3000
    health_check: httpchk GET /api/health
    health_interval: 10s
    servers:
    - name: api1-fra
      address: 10.100.2.10
      weight: 100
    - name: api2-fra
      address: 10.100.2.11
      weight: 100
