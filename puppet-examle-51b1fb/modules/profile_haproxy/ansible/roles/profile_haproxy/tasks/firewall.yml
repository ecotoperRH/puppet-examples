---
- name: Open HTTP port in firewalld
  ansible.posix.firewalld:
    port: 80/tcp
    zone: "{{ profile_haproxy_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  when: profile_haproxy_firewall_provider == 'firewalld'
- name: Open HTTPS port in firewalld
  ansible.posix.firewalld:
    port: 443/tcp
    zone: "{{ profile_haproxy_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  when: profile_haproxy_firewall_provider == 'firewalld'
- name: Open HAProxy stats port in firewalld
  ansible.posix.firewalld:
    port: "{{ profile_haproxy_stats_port }}/tcp"
    zone: "{{ profile_haproxy_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  when:
    - profile_haproxy_firewall_provider == 'firewalld'
    - profile_haproxy_stats_enabled | bool
- name: Install ufw package
  ansible.builtin.package:
    name: ufw
    state: present
  when: profile_haproxy_firewall_provider == 'ufw'
- name: Allow HTTP through ufw
  ansible.builtin.command:
    cmd: ufw allow 80/tcp
  register: profile_haproxy_ufw_http
  changed_when: "'Rules updated' in profile_haproxy_ufw_http.stdout"
  when: profile_haproxy_firewall_provider == 'ufw'
- name: Allow HTTPS through ufw
  ansible.builtin.command:
    cmd: ufw allow 443/tcp
  register: profile_haproxy_ufw_https
  changed_when: "'Rules updated' in profile_haproxy_ufw_https.stdout"
  when: profile_haproxy_firewall_provider == 'ufw'
- name: Allow HAProxy stats port through ufw
  ansible.builtin.command:
    cmd: ufw allow {{ profile_haproxy_stats_port }}/tcp
  register: profile_haproxy_ufw_stats
  changed_when: "'Rules updated' in profile_haproxy_ufw_stats.stdout"
  when:
    - profile_haproxy_firewall_provider == 'ufw'
    - profile_haproxy_stats_enabled | bool
- name: Enable ufw
  ansible.builtin.command:
    cmd: ufw --force enable
  register: profile_haproxy_ufw_enable
  changed_when: "'Firewall is active' in profile_haproxy_ufw_enable.stdout"
  when: profile_haproxy_firewall_provider == 'ufw'
- name: Warn about unknown firewall provider
  ansible.builtin.debug:
    msg: "Unknown firewall provider: {{ profile_haproxy_firewall_provider }} — no firewall rules applied"
  when: profile_haproxy_firewall_provider not in ['firewalld', 'ufw']
