---
haproxy_package_name: haproxy
haproxy_config_dir: /etc/haproxy
haproxy_config_file: /etc/haproxy/haproxy.cfg
haproxy_service_name: haproxy
haproxy_user: haproxy
haproxy_group: haproxy
haproxy_extra_packages: []
haproxy_stats_enabled: true
haproxy_stats_port: 8404
haproxy_stats_uri: /stats
haproxy_stats_user: admin
haproxy_stats_password: admin_password
haproxy_global_maxconn: 4000
haproxy_client_timeout: 30s
haproxy_server_timeout: 30s
haproxy_connect_timeout: 5s
haproxy_retries: 3
haproxy_ssl_enabled: false
haproxy_ssl_cert_path: /etc/ssl/certs
haproxy_ssl_key_path: /etc/ssl/private
haproxy_ssl_ciphers:
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
haproxy_ssl_min_version: TLSv1.2
haproxy_log_server: 127.0.0.1
haproxy_log_facility: local0
haproxy_log_level: notice
haproxy_firewall_provider: ufw
haproxy_stick_table_enabled: false
haproxy_stick_table_size: 200k
haproxy_stick_table_expire: 30m
haproxy_backends: {}
