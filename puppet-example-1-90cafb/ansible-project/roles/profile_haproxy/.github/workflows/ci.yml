---
name: CI
"on":
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: 0 6 * * 1
defaults:
  run:
    working-directory: profile_haproxy
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v3
        with:
          path: profile_haproxy
      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - name: Install dependencies
        run: pip install ansible-lint yamllint
      - name: Lint code
        run: "yamllint .\nansible-lint\n"
  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - ubuntu2004
          - debian11
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v3
        with:
          path: profile_haproxy
      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - name: Install dependencies
        run: pip install ansible molecule[docker] docker pytest-testinfra
      - name: Run Molecule tests
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}
