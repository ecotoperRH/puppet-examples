---
app_name: myapp-api
app_repo: https://github.com/example-org/myapp-api.git
app_revision: main
app_port: 8000
app_dir: /opt/myapp-api
app_user: myapp
app_group: myapp
python_version: python3
pip_packages:
  - uvicorn
  - gunicorn
  - psycopg2-binary
db_host: localhost
db_port: 5432
db_name: myapp_db
db_user: myapp_app
db_password: changeme
worker_count: 2
worker_class: uvicorn.workers.UvicornWorker
max_requests: 1000
graceful_timeout: 30
log_dir: /var/log/myapp-api
log_level: info
log_max_size: 100M
log_rotate_count: 7
