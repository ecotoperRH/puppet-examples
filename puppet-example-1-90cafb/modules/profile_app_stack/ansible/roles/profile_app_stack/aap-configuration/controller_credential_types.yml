---
controller_credential_types:
- name: PostgreSQL Database
  description: Credential type for PostgreSQL Database
  kind: cloud
  inputs:
    fields:
    - id: db_user
      type: string
      label: Database Username
      help_text: Username for PostgreSQL database authentication
    - id: db_password
      type: string
      label: Database Password
      secret: true
      help_text: Password for PostgreSQL database authentication
    required:
    - db_user
    - db_password
  injectors:
    extra_vars:
      db_user: !unsafe '{{ db_user }}'
      db_password: !unsafe '{{ db_password }}'
- name: Application Secret Key
  description: Credential type for Application Secret Key
  kind: cloud
  inputs:
    fields:
    - id: secret_key
      type: string
      label: Application Secret Key
      secret: true
      help_text: Secret key used for application security, session encryption, and
        CSRF protection
    required:
    - secret_key
  injectors:
    extra_vars:
      secret_key: !unsafe '{{ secret_key }}'
- name: HAProxy Statistics
  description: Credential type for HAProxy Statistics
  kind: cloud
  inputs:
    fields:
    - id: stats_user
      type: string
      label: Statistics Username
      help_text: Username for HAProxy statistics interface authentication
    - id: stats_password
      type: string
      label: Statistics Password
      secret: true
      help_text: Password for HAProxy statistics interface authentication
    required:
    - stats_user
    - stats_password
  injectors:
    extra_vars:
      stats_user: !unsafe '{{ stats_user }}'
      stats_password: !unsafe '{{ stats_password }}'
- name: Redis Authentication
  description: Credential type for Redis Authentication
  kind: cloud
  inputs:
    fields:
    - id: redis_password
      type: string
      label: Redis Password
      secret: true
      help_text: Password for Redis authentication
    required:
    - redis_password
  injectors:
    extra_vars:
      redis_password: !unsafe '{{ redis_password }}'
