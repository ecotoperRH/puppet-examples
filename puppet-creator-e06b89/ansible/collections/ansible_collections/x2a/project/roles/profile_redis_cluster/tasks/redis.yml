---
- name: Configure the Redis service stack
  ansible.builtin.include_tasks: preinstall.yml

- name: Install Redis package
  ansible.builtin.include_tasks: install_redis.yml

- name: Configure Redis files
  ansible.builtin.include_tasks: config.yml

- name: Configure the default Redis instance
  ansible.builtin.include_tasks: instance.yml

- name: Remove obsolete Redis ulimit drop-in
  ansible.builtin.include_tasks: ulimit.yml

- name: Manage Redis service
  ansible.builtin.include_tasks: service.yml
