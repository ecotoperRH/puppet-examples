---
controller_credential_types:
  - name: Redis Cluster Client Password
    description: Password required for Redis client authentication via the Redis requirepass setting. The source plan identifies a test value and an insecure 
      manifest default; the migrated value should be stored securely as vault_redis_cluster_password.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password configured as Redis requirepass and used to authenticate Redis clients.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
