---
controller_credentials:
- name: PostgreSQL Database Credentials - profile_app_stack
  description: Credential for profile_app_stack
  organization: Default
  credential_type: PostgreSQL Database Credentials
  update_secrets: true
  inputs:
    db_user: '{{ db_user }}'
    db_password: '{{ vault_db_password }}'
    db_host: '{{ db_host }}'
    db_port: '{{ db_port }}'
    db_name: '{{ db_name }}'
- name: Application Secret Key - profile_app_stack
  description: Credential for profile_app_stack
  organization: Default
  credential_type: Application Secret Key
  update_secrets: true
  inputs:
    secret_key: '{{ vault_secret_key }}'
