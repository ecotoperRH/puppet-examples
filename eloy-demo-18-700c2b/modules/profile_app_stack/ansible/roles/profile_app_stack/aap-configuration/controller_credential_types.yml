---
controller_credential_types:
- name: PostgreSQL Database Credentials
  description: Credential type for PostgreSQL Database Credentials
  kind: cloud
  inputs:
    fields:
    - id: db_user
      type: string
      label: Database Username
      help_text: PostgreSQL database username for application access
    - id: db_password
      type: string
      label: Database Password
      secret: true
      help_text: PostgreSQL database password for authentication
    - id: db_host
      type: string
      label: Database Host
      help_text: PostgreSQL database hostname or IP address
    - id: db_port
      type: string
      label: Database Port
      help_text: PostgreSQL database port number
    - id: db_name
      type: string
      label: Database Name
      help_text: PostgreSQL database name to connect to
    required:
    - db_user
    - db_password
    - db_host
    - db_name
  injectors:
    extra_vars:
      db_user: !unsafe '{{ db_user }}'
      db_password: !unsafe '{{ db_password }}'
      db_host: !unsafe '{{ db_host }}'
      db_port: !unsafe '{{ db_port }}'
      db_name: !unsafe '{{ db_name }}'
- name: Application Secret Key
  description: Credential type for Application Secret Key
  kind: cloud
  inputs:
    fields:
    - id: secret_key
      type: string
      label: Application Secret Key
      secret: true
      help_text: Secret key used for application security, session encryption, and
        CSRF protection
    required:
    - secret_key
  injectors:
    extra_vars:
      secret_key: !unsafe '{{ secret_key }}'
