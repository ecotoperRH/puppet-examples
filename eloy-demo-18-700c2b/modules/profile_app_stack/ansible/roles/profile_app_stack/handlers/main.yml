---
- name: Restart application service
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: restarted
    daemon_reload: true
  listen: restart app service
- name: Reload application service
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: reloaded
  listen: reload app service
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  listen: systemd daemon-reload
