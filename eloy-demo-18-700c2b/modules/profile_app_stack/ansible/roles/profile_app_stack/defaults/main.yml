---
app_name: app_stack
app_environment: production
app_domain: example.com
app_port: 8000
app_base_dir: /opt/app_stack
app_config_dir: /etc/app_stack
app_data_dir: /var/lib/app_stack
app_log_dir: /var/log/app_stack
app_venv_dir: /opt/app_stack/venv
app_user: app
app_group: app
app_repo_url: https://github.com/example/app_stack.git
app_revision: main
worker_count: 4
max_requests: 1000
log_level: info
enable_cache: true
metrics_enabled: true
python_bin: /usr/bin/python3
db_type: postgresql
db_host: localhost
db_port: 5432
db_name: app_stack
db_user: app_stack
use_redis: true
redis_host: localhost
redis_port: 6379
redis_db: 0
required_packages:
  - git
  - python3
  - python3-pip
  - python3-venv
  - python3-dev
  - build-essential
  - libpq-dev
nginx_log_dir: /var/log/nginx
